# ============================================================================
# VGGT 训练配置文件（带中文注释）
# ============================================================================

defaults:
  - default_dataset.yaml         # 继承默认数据集配置

# -------------------- 实验基本设置 --------------------
exp_name: exp001                # 实验名称，用于日志和检查点目录命名
img_size: 518                   # 输入图像尺寸（像素），模型接收 518x518 的图像
num_workers: 8                  # DataLoader 的并行 worker 数，根据 CPU 核心数调整
seed_value: 42                  # 随机种子，保证实验可复现
accum_steps: 2                  # 梯度累积步数。原论文训练中未使用梯度累积，若显存不足(OOM)可增大此值
                                # 原理：每 accum_steps 个 batch 才更新一次参数，等效于增大 batch size
patch_size: 14                  # ViT 的 patch 大小，14x14 像素为一个 patch
val_epoch_freq: 5               # 每多少个 epoch 做一次验证
max_img_per_gpu: 48             # 每张 GPU 上每次迭代加载的最大图像数，控制显存占用

limit_train_batches: 800        # 每个 epoch 训练时最多使用多少个 batch，用于限制训练集大小
limit_val_batches: 400          # 每次验证时最多使用多少个 batch，用于限制验证集大小

# -------------------- 数据配置 --------------------
data:
  # 原作者注：数据加载的代码看起来还是太复杂了，应该重构一下（但有没有时间呢...）
  train:                        # 训练数据
    _target_: data.dynamic_dataloader.DynamicTorchDataset   # 动态数据加载器类
    num_workers: ${num_workers}          # 引用上面的 num_workers 变量
    max_img_per_gpu: ${max_img_per_gpu} # 引用上面的 max_img_per_gpu 变量
    common_config:                       # 所有数据集共享的通用配置
      img_size: ${img_size}             # 图像尺寸
      patch_size: ${patch_size}         # patch 大小
      debug: False                      # 调试模式开关，开启后会输出更多日志
      repeat_batch: False               # 是否重复同一个 batch（调试用，正常训练为 False）
    dataset:
      _target_: data.composed_dataset.ComposedDataset   # 组合数据集，可合并多个子数据集
      dataset_configs:                                  # 子数据集列表
        - _target_: data.datasets.co3d.Co3dDataset      # Co3D 数据集（Common Objects in 3D）
          split: train                                   # 使用训练集划分
          CO3D_DIR: /YOUR/PATH/TO/CO3D                   # ⚠️ 请替换为 Co3D 数据集的本地路径
          CO3D_ANNOTATION_DIR: /YOUR/PATH/TO/CO3D_ANNOTATION  # ⚠️ 请替换为 Co3D 标注文件的本地路径

  val:                          # 验证数据（结构与训练数据一致）
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False              # 验证时无需开启 debug
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.co3d.Co3dDataset
          split: test            # 验证集使用 test 划分
          CO3D_DIR: /YOUR/PATH/TO/CO3D
          CO3D_ANNOTATION_DIR: /YOUR/PATH/TO/CO3D_ANNOTATION

# -------------------- 日志与可视化配置 --------------------
logging:
  log_dir: logs                  # 日志根目录
  log_visuals: False             # 是否记录可视化结果（如图像深度预测的可视化），开启会增加存储开销
  log_freq: 1                    # 日志记录频率（每多少个 step 记录一次）
  log_level_primary: DEBUG       # 主日志级别（DEBUG/INFO/WARNING/ERROR）
  log_level_secondary: WARNING   # 辅助日志级别，通常比主日志级别高
  all_ranks: False               # 是否记录所有 GPU rank 的日志，通常只需 rank 0
  tensorboard_writer:            # TensorBoard 写入器配置
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard   # TensorBoard 日志存放路径
  scalar_keys_to_log:            # 需要记录到 TensorBoard 的标量键值
    train:                       # 训练时记录的损失项
      keys_to_log:
        - loss_objective         # 总目标损失
        - loss_camera            # 相机参数损失
        - loss_T                 # 平移向量(T)损失
        - loss_R                 # 旋转矩阵(R)损失
        - loss_FL                # 焦距损失
        - loss_conf_depth        # 深度置信度损失
        - loss_reg_depth         # 深度正则化损失
        - loss_grad_depth        # 深度梯度损失
    val:                         # 验证时记录的损失项（与训练一致）
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth

# -------------------- 检查点配置 --------------------
checkpoint:
  save_dir: logs/${exp_name}/ckpts     # 检查点保存目录，按实验名称区分
  save_freq: 5                          # 每多少个 epoch 保存一次检查点
  resume_checkpoint_path: /YOUR/PATH/TO/CKPT   # ⚠️ 从已有检查点恢复训练的路径（留空则从头训练）
  strict: False                         # 加载检查点时是否严格匹配所有参数名，False 允许部分加载（如微调场景）

# -------------------- 损失函数配置 --------------------
loss:
  _target_: loss.MultitaskLoss           # 多任务损失函数类
  camera:                                # 相机位姿估计损失
    weight: 5.0                          # 损失权重，数值越大该任务在总损失中占比越高
    loss_type: "l1"                      # 损失类型。论文原本使用 smooth l1 损失，但作者发现 l1 更稳定
                                         # 可选值: "l1" / "smooth_l1" / "l2"
  depth:                                 # 深度估计损失
    weight: 1.0                          # 损失权重（相对于相机损失，深度损失权重较低）
    gradient_loss_fn: "grad"             # 梯度损失函数类型: "grad" 或 "normal"
    valid_range: 0.98                    # 有效深度范围（归一化值），超出该范围的像素不计算损失
  point: null                            # 点云损失，默认关闭。如需开启，使用下面的配置
  # point:                               # 点云损失的示例配置（被注释掉）
  #   weight: 1.0
  #   gradient_loss_fn: "normal"
  #   valid_range: 0.98
  track: null                            # 轨迹/跟踪损失，默认关闭

# -------------------- 优化器与学习率配置 --------------------
optim:
  param_group_modifiers: False           # 是否启用参数组修改器（可对不同层设置不同学习率）

  optimizer:                             # 优化器配置
    _target_: torch.optim.AdamW          # 使用 AdamW 优化器（Adam + 解耦权重衰减）
    lr: 5e-5                             # 基础学习率
    weight_decay: 0.05                   # 权重衰减系数（L2 正则化强度）

  frozen_module_names:                   # 冻结模块名称列表（这些模块的参数不参与训练）
      - "*aggregator*"                   # 例：冻结所有名称中包含 "aggregator" 的模块

  amp:                                   # 自动混合精度训练（Automatic Mixed Precision）
    enabled: True                        # 启用 AMP，可显著减少显存占用并加速训练
    amp_dtype: bfloat16                  # AMP 数据类型，bfloat16 比 float16 数值范围更大，更不易溢出

  gradient_clip:                         # 梯度裁剪，防止梯度爆炸导致训练不稳定
    _target_: train_utils.gradient_clip.GradientClipper
    configs:                             # 可按模块分别配置裁剪参数
      - module_name: ["aggregator"]      # aggregator 模块
        max_norm: 1.0                    # 梯度范数上限，超过此值会被缩放。若训练不稳定可适当降低
        norm_type: 2                     # 范数类型：2 为 L2 范数
      - module_name: ["depth"]           # 深度模块
        max_norm: 1.0                    # 梯度范数上限，若训练不稳定可适当降低
        norm_type: 2
      - module_name: ["camera"]          # 相机模块
        max_norm: 1.0                    # 梯度范数上限，若训练不稳定可适当降低
        norm_type: 2

  options:                               # 学习率调度器配置
    lr:                                  # 学习率调度
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler  # 组合调度器，将多个调度器串联
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler   # 线性预热阶段
              start_value: 1e-8                                             # 起始学习率（接近 0）
              end_value: 5e-5                                               # 预热结束时的学习率
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler  # 余弦衰减阶段
              start_value: 5e-5                                             # 衰减起始学习率
              end_value: 1e-8                                               # 衰减结束学习率（接近 0）
          lengths: [0.05, 0.95]            # 各阶段的相对长度：5% 预热 + 95% 余弦衰减
          interval_scaling: ['rescaled', 'rescaled']   # 各阶段内部的时间缩放方式
    weight_decay:                         # 权重衰减调度（本例中使用常量）
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05                     # 全程保持 0.05 的权重衰减

# -------------------- 训练循环配置 --------------------
max_epochs: 20                           # 最大训练轮数

# -------------------- 模型架构配置 --------------------
model:
  _target_: vggt.models.vggt.VGGT        # VGGT 模型类
  enable_camera: True                    # 启用相机位姿估计头
  enable_depth: True                     # 启用深度估计头
  enable_point: False                    # 启用点云估计头（默认关闭）
  enable_track: False                    # 启用轨迹/跟踪头（默认关闭）

# -------------------- 分布式训练配置 --------------------
distributed:
  # 详见 PyTorch DDP 文档: https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html
  backend: nccl                          # 分布式后端，NCCL 为 NVIDIA GPU 专用，性能最优
  comms_dtype: None                      # 通信时的数据类型，None 表示使用默认精度
  find_unused_parameters: False          # 是否查找未使用的参数（开启会拖慢初始化，通常设为 False）
  timeout_mins: 30                       # 分布式操作超时时间（分钟）
  gradient_as_bucket_view: True          # 将梯度作为 bucket 视图传递，节省显存
  bucket_cap_mb: 25                      # 梯度 bucket 的容量上限（MB）
  broadcast_buffers: True                # 在 forward 前广播 buffer（如 BatchNorm 的 running mean）

# -------------------- CUDA / GPU 配置 --------------------
cuda:
    cudnn_deterministic: False           # cuDNN 确定性模式。False 允许非确定性算法以换取速度
    cudnn_benchmark: False               # cuDNN 自动寻找最优卷积算法。False 保证确定性，True 可能加速但结果不可复现
    allow_tf32: True                     # 允许使用 TF32 精度（Ampere 及以上架构），加速训练且精度损失极小
